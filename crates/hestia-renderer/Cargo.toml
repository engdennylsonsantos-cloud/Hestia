[package]
name = "hestia-renderer"
version = "0.1.0"
edition = "2021"
description = "Renderizador arquitetônico independente: plugin do Hestia em processo separado (protocolo de plugins 1.0)."
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

