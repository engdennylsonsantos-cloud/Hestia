<!doctype html>

<title>Hestia · Protótipo do editor de esquadrias</title>
<style>
/* ===== apps/web/src/styles.css (cópia fiel) ===== */
/* Paleta Canônica Autodesk Revit 2024 */
:root {
  --bg: #dcdfe3;
  --chrome: #e6eaed;
  --ribbon: #f0f3f5;
  --panel: #f7f9fa;
  --sheet: #ffffff;
  --line: #ced5db;
  --line-strong: #b2bcc4;
  --fg: #1a202c;
  --fg-soft: #4a5568;
  --fg-faint: #718096;
  --accent: #0078d4;
  --accent-fg: #ffffff;
  --accent-soft: #deecf9;
  --revit-green: #107c41;
  --revit-green-soft: #dff6dd;
  --revit-green-border: #22c55e;
  --select: #0078d4;
  --warn: #c25e00;
  --danger: #d13438;
  --ok: #107c41;
  --shadow: 0 4px 18px rgba(0, 0, 0, 0.14);
  --font-ui: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  --font-mono: 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
  /* Célula somente leitura da tabela de propriedades (parâmetro que vem do tipo ou é calculado). */
  --ro: #eceff2;
  --r: 3px;
  --ic-ink: #5b6369;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #141414;
    --chrome: #1f1f1f;
    --ribbon: #333333;
    --panel: #252525;
    --sheet: #1e1e1e;
    --line: #383838;
    --line-strong: #484848;
    --fg: #f3f4f6;
    --fg-soft: #a1a1aa;
    --fg-faint: #71717a;
    --accent: #60a5fa;
    --accent-fg: #0f172a;
    --accent-soft: #1e3a5f;
    --revit-green: #4ade80;
    --revit-green-soft: #173827;
    --revit-green-border: #22c55e;
    --select: #3b82f6;
    --warn: #fb923c;
    --danger: #f87171;
    --ok: #4ade80;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
    --ic-ink: #c3c9cf;
    --ro: #2e2e2e;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #141414;
  --chrome: #1f1f1f;
  --ribbon: #333333;
  --panel: #252525;
  --sheet: #1e1e1e;
  --line: #383838;
  --line-strong: #484848;
  --fg: #f3f4f6;
  --fg-soft: #a1a1aa;
  --fg-faint: #71717a;
  --accent: #60a5fa;
  --accent-fg: #0f172a;
  --accent-soft: #1e3a5f;
  --revit-green: #4ade80;
  --revit-green-soft: #173827;
  --revit-green-border: #22c55e;
  --select: #3b82f6;
  --warn: #fb923c;
  --danger: #f87171;
  --ok: #4ade80;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
  --ic-ink: #c3c9cf;
  --ro: #2e2e2e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* Janela de aplicativo: ocupa a janela toda, sem margens nem rolagem da página (quem rola são os painéis). */
html, body, #root { height: 100%; overflow: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 12.5px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
}
/* Interface não é texto de página: nada seleciona por padrão. Campos e tabelas de dados liberam a seleção (bloco abaixo). */
html, body, body * { -webkit-user-select: none; user-select: none; }
input, textarea, select, [contenteditable], .selectable, .selectable *,
.wsched, .wsched *, .layers, .layers *, .kbtable, .kbtable *, .matlist, .matlist *,
.dialog .error, .dialog .hint {
  -webkit-user-select: text;
  user-select: text;
}
button, input, select, textarea { font: inherit; color: inherit; }
/* Botões usam a seta do sistema, não a mão do navegador. O white-space: nowrap é conferido por scripts/check-props-density.mjs. */
button { cursor: default; white-space: nowrap; }

/* Barras de rolagem em estilo Windows: 12 px, quadradas. ::-webkit-scrollbar só (sem scrollbar-width, para não sobrepor). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--chrome); }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 0; }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--line-strong) 70%, var(--fg)); }
::-webkit-scrollbar-corner { background: var(--chrome); }
/* Áreas que escondem a barra de propósito (faixa e barra de controle da vista, em ribbon.css) continuam sem barra. */
.vcb::-webkit-scrollbar { display: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg { display: block; }

.app {
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
  /* Coluna fixa em minmax(0, 1fr): o conteúdo da barra de status não pode alargar a janela. */
  grid-template-columns: minmax(0, 1fr);
  background: var(--chrome);
  /* Sem borda externa e cantos retos: a janela é a própria janela do sistema. */
  border: 0;
  border-radius: 0;
  overflow: hidden;
  position: relative;
}

/* ---- barra de título ---- */
.badge { font-family: var(--font-mono); font-size: 10.5px; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--line-strong); color: var(--fg-soft); }
.badge.gpu { color: var(--accent); border-color: var(--accent); }
.badge.cpu { color: var(--warn); border-color: var(--warn); }

/* ---- botões ---- */
.ibtn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent; background: transparent; padding: 4px 7px; border-radius: var(--r); color: var(--fg); }
.ibtn:hover:not(:disabled) { background: var(--panel); border-color: var(--line); }
.ibtn:disabled { opacity: 0.4; cursor: default; }
.ibtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn { border: 1px solid var(--line-strong); background: var(--panel); padding: 4px 10px; border-radius: 2px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
.btn.danger { color: var(--danger); }
.btn.small { padding: 2px 7px; font-size: 11.5px; }

/* ---- faixa de ferramentas ---- */

/* ---- barra de opções ---- */
.optbar { display: flex; align-items: center; gap: 12px; padding: 4px 10px; background: var(--chrome); border-bottom: 1px solid var(--line); min-height: 32px; flex-wrap: wrap; }
.optbar label { display: inline-flex; align-items: center; gap: 5px; color: var(--fg-soft); }
.optbar .tool-name { font-weight: 600; color: var(--fg); }

/* ---- campos ---- */
.input, .select { border: 1px solid var(--line-strong); background: var(--sheet); border-radius: 2px; padding: 3px 6px; min-width: 0; height: 24px; }
.input:focus, .select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
.input.num { font-family: var(--font-mono); text-align: right; width: 72px; }
.input.wide { width: 100%; }
.unit { color: var(--fg-faint); font-family: var(--font-mono); font-size: 11px; margin-left: 4px; }
.numwrap { display: inline-flex; align-items: center; }
.check { display: inline-flex; align-items: center; gap: 6px; }
.input.ro { background: transparent; border-color: transparent; color: var(--fg-soft); cursor: default; }

/* ---- painéis laterais ---- */
.workspace { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; min-height: 0; }
.side { flex: 1; min-height: 0; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; border-bottom: 1px solid var(--line); font-weight: 600; background: var(--chrome); }
.panel-scroll { overflow: auto; flex: 1; min-height: 0; background: var(--sheet); }
/* Grupo recolhível: cabeçalho em barra de cromo, com o chevron à direita (▲ aberto, ▼ fechado). */
.pgroup { border-bottom: 1px solid var(--line-strong); }
.pgroup > summary { list-style: none; cursor: default; padding: 2px 8px; background: var(--chrome); font-weight: 600; font-size: 11px; color: var(--fg-soft); display: flex; align-items: center; gap: 6px; user-select: none; border-bottom: 1px solid var(--line); }
.pgroup > summary:hover { background: var(--accent-soft); }
.pgroup > summary::-webkit-details-marker { display: none; }
.pgroup > summary::after { content: ''; margin-left: auto; border: solid var(--fg-faint); border-width: 0 1.5px 1.5px 0; padding: 2.5px; transform: rotate(45deg); transition: transform 0.12s; }
.pgroup[open] > summary::after { transform: rotate(-135deg); }
/*
 * Linha da tabela de propriedades (estilo Revit): rótulo à esquerda (46%) e valor à direita (54%), com divisória
 * entre as células. O campo fica sem caixa até o ponteiro passar ou o foco entrar. Sem `grid-template-columns` fixo
 * em pixels: a paleta tem largura de `.side`, e a tabela acompanha.
 */
.prow { display: grid; grid-template-columns: var(--lbl, 46%) minmax(0, 1fr); align-items: stretch; min-height: 22px; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow > label, .prow > .lbl { display: flex; align-items: center; min-width: 0; padding: 2px 8px; border-right: 1px solid var(--line); font-size: 11px; color: var(--fg-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow > div { display: flex; align-items: center; min-width: 0; }
.prow > .val, .prow > div > .val { font-family: var(--font-mono); font-size: 11px; color: var(--fg); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow > .val { display: flex; align-items: center; justify-content: flex-end; padding: 0 6px; min-width: 0; }
.prow > div > .val { width: 100%; padding: 0 6px; }
/* Linha de botão (o primeiro filho é um `<span />` vazio): o botão ocupa a largura toda, sem espremer o texto. */
.prow:has(> span:empty) { grid-template-columns: minmax(0, 1fr); }
.prow > span:empty { display: none; }
.prow > div > .select, .prow > div > .input.wide, .prow > div > .numwrap { width: 100%; min-width: 0; }
.prow > div > .numwrap { display: flex; align-items: center; }
.prow .input, .prow .select { height: 100%; min-height: 21px; width: 100%; padding: 0 6px; border: 0; border-radius: 0; background: transparent; }
.prow .input:focus, .prow .select:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--sheet); border: 0; box-shadow: none; }
.prow .input.num { width: auto; flex: 1; min-width: 0; text-align: right; }
.prow .numwrap .unit { padding-right: 6px; }
.prow > div > .check { padding: 0 6px; font-size: 11px; }
.prow .val.soft { color: var(--fg-soft); }
.prow > div > .btn { margin: 0 4px; height: 18px; padding: 0 8px; font-size: 11px; }
/* Parâmetro somente leitura: célula sombreada. Quando vem do tipo, o selo "tipo" avisa onde se altera. */
.prow.ro > label, .prow.ro > .lbl, .prow.ro > .val, .prow.ro > div { background: var(--ro); }
.prow.ro > div { color: var(--fg-soft); }
.tmark { flex: 0 0 auto; margin-left: 5px; font-size: 9px; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 0 4px; }
.prow .sw { margin: 0 6px; }

/* ---- paleta de propriedades estilo Revit: prévia, seletor de tipo, filtro e rodapé ---- */
/* Cores da prévia fixas no tema claro (o fundo é claro nos dois temas, então o desenho também). */
.rv-preview, .rv-thumb { --fg: #1a202c; --fg-soft: #4a5568; --fg-faint: #718096; --accent: #0078d4; --sheet: #ffffff; --bg-soft: transparent; color-scheme: light; }
.rv-preview { position: relative; margin: 8px 8px 0; border: 1px solid var(--line-strong); background: linear-gradient(#f7fafc, #e3e9ee); height: 120px; display: grid; place-items: center; overflow: hidden; }
.rv-preview > svg, .rv-preview .section-svg { width: 100%; height: 100%; display: block; border: 0; background: transparent; }
.rv-preview .chip, .rv-preview .dims { position: absolute; bottom: 4px; font: 10px var(--font-mono); color: #4a5568; background: rgba(255, 255, 255, 0.8); padding: 0 5px; border-radius: 2px; }
.rv-preview .chip { left: 5px; }
.rv-preview .dims { right: 5px; max-width: calc(100% - 64px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Miniatura: sem os rótulos de texto do desenho (ficariam ilegíveis e poluiriam o nome acessível do botão). */
.rv-thumb svg text { display: none; }
.rv-thumb { width: 38px; height: 26px; flex: 0 0 auto; background: linear-gradient(#f7fafc, #e3e9ee); border: 1px solid var(--line); display: block; overflow: hidden; }
.rv-thumb > svg, .rv-thumb .section-svg { width: 100%; height: 100%; display: block; border: 0; background: transparent; }
/* Sticky: o seletor e o filtro ficam no topo da paleta ao rolar; o menu de tipos abre por cima dos grupos. */
.rv-stick { position: sticky; top: 0; z-index: 4; background: var(--panel); border-bottom: 1px solid var(--line-strong); padding-bottom: 6px; }
.rv-stick.rv-stick-open { z-index: 30; }
.rv-tsel-wrap { position: relative; margin: 6px 8px 0; }
.rv-tsel { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line-strong); background: var(--sheet); border-radius: var(--r); padding: 3px 8px; min-height: 38px; }
.rv-tsel:hover:not(:disabled), .rv-tsel[aria-expanded='true'] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.rv-tsel:disabled { opacity: 0.6; cursor: default; }
.rv-tsel .two { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rv-tsel .two b { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-tsel .two span { font-size: 11px; color: var(--fg-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-tsel .chev { color: var(--fg-faint); font-size: 10px; }
.rv-menu { position: absolute; left: 0; right: 0; top: calc(100% + 2px); z-index: 20; background: var(--sheet); border: 1px solid var(--accent); box-shadow: var(--shadow); max-height: 430px; display: flex; flex-direction: column; }
.rv-menu .search { margin: 6px; border: 1px solid var(--line-strong); border-radius: var(--r); padding: 3px 7px; background: var(--sheet); height: 24px; }
.rv-menu .search:focus { outline: none; border-color: var(--accent); }
.rv-menu .list { overflow: auto; padding-bottom: 4px; }
.rv-menu .fam { font-weight: 600; padding: 4px 8px 2px; font-size: 11px; color: var(--fg-soft); background: var(--chrome); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
.rv-menu .opt { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 3px 8px 3px 14px; color: var(--fg); }
.rv-menu .opt:hover { background: var(--accent-soft); }
.rv-menu .opt.on { background: var(--accent); color: var(--accent-fg); }
.rv-menu .opt .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-menu .opt .c { font: 10px var(--font-mono); opacity: 0.7; }
.rv-menu .empty { padding: 10px; color: var(--fg-faint); }
.rv-filter { display: flex; gap: 6px; margin: 6px 8px 0; }
.rv-filter .filt { flex: 1; min-width: 0; border: 1px solid var(--line-strong); background: var(--sheet); border-radius: var(--r); padding: 2px 8px; height: 24px; font-weight: 600; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
.rv-filter .edit { border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--r); padding: 2px 10px; height: 24px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.rv-filter .edit:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.rv-filter .edit:disabled { opacity: 0.45; cursor: default; }
.rv-head { padding: 6px 8px; border-bottom: 1px solid var(--line-strong); background: var(--panel); }
.rv-head b { display: block; font-size: 12px; }
.rv-head span { display: block; font-size: 11px; color: var(--fg-soft); }
.rv-foot { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-top: 1px solid var(--line-strong); background: var(--chrome); }
.rv-foot .link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.rv-foot .apply { border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--r); padding: 2px 14px; }
.rv-foot .apply:hover { border-color: var(--accent); }
.rv-hint { padding: 8px 10px; color: var(--fg-faint); font-size: 11px; }
.hint { padding: 10px; color: var(--fg-soft); }
.side .hint { padding: 4px 8px; font-size: 11px; }
.vr-error { padding: 2px 10px 4px; color: var(--danger); font-size: 11.5px; }
.vr-msg { color: var(--warn); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chiplink { color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.mixed::placeholder { color: var(--fg-faint); }

/* ---- navegador de projeto ---- */

/* ---- área de trabalho ---- */
.stage { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; background: var(--bg); }
/* Barra de abas superior com agrupador (overflow) quando há muitas abas/pavimentos */
.viewtabs { display: flex; gap: 2px; padding: 4px 6px 0; background: var(--chrome); border-bottom: 1px solid var(--line-strong); overflow: visible; min-width: 0; flex-shrink: 0; position: relative; }
.vtab { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 4px 10px; border-radius: 5px 5px 0 0; color: var(--fg-soft); display: inline-flex; gap: 5px; align-items: center; margin-bottom: -1px; white-space: nowrap; flex-shrink: 0; font-size: 12.5px; cursor: default; }
.vtab.on { background: var(--sheet); border-color: var(--line-strong); color: var(--fg); font-weight: 500; }
.vtab-overflow { position: relative; display: inline-flex; align-items: center; }
.vtab-overflow-btn { border: 1px solid var(--line); border-bottom: 0; background: var(--panel); padding: 4px 8px; border-radius: 5px 5px 0 0; color: var(--fg-soft); display: inline-flex; gap: 5px; align-items: center; margin-bottom: -1px; white-space: nowrap; flex-shrink: 0; font-size: 12px; font-weight: 500; cursor: default; transition: background 0.15s, color 0.15s; }
.vtab-overflow-btn:hover { background: var(--sheet); color: var(--fg); }
.vtab-overflow-btn.has-active { border-color: var(--line-strong); color: var(--accent); }
.vtab-overflow-badge { background: var(--line-strong); color: var(--fg); font-size: 10px; font-family: var(--font-mono); padding: 1px 5px; border-radius: 10px; line-height: 1.2; }
.vtab-overflow-menu { position: absolute; top: 100%; left: 0; margin-top: 1px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22); padding: 4px; min-width: 170px; max-width: 260px; max-height: 60vh; overflow-y: auto; z-index: 100; display: flex; flex-direction: column; gap: 2px; }
.vtab-overflow-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: none; background: transparent; border-radius: 4px; color: var(--fg); font-size: 12px; font-family: inherit; text-align: left; cursor: default; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vtab-overflow-item:hover { background: var(--hover); }
.vtab-overflow-item.on { background: var(--accent-dim, rgba(24, 119, 242, 0.1)); color: var(--accent); font-weight: 600; }
.vtab-controls { display: flex; align-items: center; gap: 2px; background: var(--chrome); padding-left: 4px; flex-shrink: 0; }
.vtab-close { width: 20px; height: 20px; padding: 0; font-size: 14px; line-height: 1; justify-content: center; }
.views-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 0; padding: 24px 16px; text-align: center; background: var(--bg); color: var(--fg-soft); }
.views-empty h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--fg); }
.views-empty p { margin: 0; max-width: 340px; font-size: 12.5px; line-height: 1.5; color: var(--fg-faint); }

.canvas-wrap { position: relative; background: var(--sheet); min-height: 0; overflow: hidden; touch-action: none; }
.canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.plan-mask-layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.dim-label { position: absolute; transform: translate(0, -100%); font-family: var(--font-mono); font-size: 11px; background: var(--sheet); border: 1px solid var(--accent); color: var(--accent); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
.dim-label--soft { color: var(--fg-soft); opacity: 0.8; }
/* Cota e texto de anotação (decisão 0019): sem caixa, na cor da tinta da planta. */
.plan-note { position: absolute; z-index: 2; font-family: var(--font-ui); color: var(--fg); white-space: nowrap; line-height: 1.15; pointer-events: none; }
.dim-label { z-index: 2; }
.typebox { position: absolute; left: 14px; bottom: 44px; z-index: 11; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 5px 9px; box-shadow: var(--shadow); font-family: var(--font-mono); }
.typebox .cap { font-family: var(--font-ui); color: var(--fg-soft); }
.typebox .buf { min-width: 60px; font-size: 14px; }
.typebox .buf:empty::after { content: '…'; color: var(--fg-faint); }
/* ViewCube (vista 3D): cubo CSS 3D pequeno, discreto, abaixo do botão de enquadrar. Repouso em 85% de opacidade. */
.viewcube { position: absolute; right: 10px; top: 46px; z-index: 2; width: 104px; max-width: calc(100% - 16px); display: grid; justify-items: center; gap: 2px; user-select: none; -webkit-user-select: none; opacity: 0.85; transition: opacity 0.15s ease; }
.viewcube:hover, .viewcube:focus-within { opacity: 1; }
.vc-stage { width: 104px; height: 104px; display: grid; place-items: center; touch-action: none; cursor: pointer; }
.vc-stage:active { cursor: grabbing; }
/* --vc-half (metade do lado, 32 px: cubo de 64 px) é definido inline pelo componente: a mesma constante que a geometria de clique usa. */
.vc-cube { position: relative; width: calc(var(--vc-half) * 2); height: calc(var(--vc-half) * 2); transform-style: preserve-3d; }
/* Faces e células não recebem o ponteiro: o palco resolve o clique pela geometria. As células continuam focáveis. */
.vc-face { position: absolute; inset: 0; display: grid; grid-template-columns: 22% 56% 22%; grid-template-rows: 22% 56% 22%; backface-visibility: hidden; -webkit-backface-visibility: hidden; pointer-events: none; }
/* Arestas finas e claras; o rótulo da face é pequeno e sem negrito, para não pesar sobre a vista. */
.vc-cell { display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; border: 0.5px solid var(--line-strong); background: var(--panel); color: var(--fg-soft); font-size: 7px; font-weight: 500; line-height: 1; letter-spacing: 0; box-sizing: border-box; pointer-events: none; white-space: nowrap; }
.vc-cell--face { background: var(--sheet); color: var(--fg-soft); }
/* Destaque sutil: tinta da cor de seleção do tema, sem bloco chapado. */
.vc-cell.is-hover { background: color-mix(in srgb, var(--select) 22%, transparent); border-color: var(--select); color: var(--fg); }
.vc-cell:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; z-index: 1; }
/* Giros e Início numa fileira; Perspectiva/Ortogonal quebra para a linha de baixo. Sem caixa de fundo em repouso. */
.vc-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px; width: 100%; }
.vc-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 4px; border: 1px solid transparent; background: transparent; color: var(--fg-soft); border-radius: var(--r); font-size: 10px; cursor: pointer; }
.vc-btn svg { width: 12px; height: 12px; }
.vc-btn--wide { order: 3; min-width: 88px; }
/* Com o cursor sobre o cubo, os botões ganham uma caixa fina; em repouso ficam só como ícones. */
.viewcube:hover .vc-btn { background: var(--panel); border-color: var(--line); color: var(--fg); }
.viewcube .vc-btn:hover { background: color-mix(in srgb, var(--select) 16%, transparent); border-color: var(--select); color: var(--fg); }
.viewcube .vc-btn[aria-pressed='true'] { background: color-mix(in srgb, var(--select) 16%, transparent); border-color: var(--select); color: var(--fg); }
.vc-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
.cpu-note { position: absolute; left: 12px; top: 10px; background: var(--panel); border: 1px solid var(--warn); color: var(--warn); border-radius: 4px; padding: 3px 8px; font-size: 11px; }

/* ---- barra de status ---- */
.statusbar { display: flex; gap: 14px; align-items: center; padding: 4px 10px; border-top: 1px solid var(--line-strong); background: var(--chrome); color: var(--fg-soft); min-height: 26px; min-width: 0; }
.statusbar .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
.statusbar .mono { font-family: var(--font-mono); font-size: 11px; white-space: nowrap; }
/* Larguras reservadas: o texto que muda não empurra os outros itens (e portanto o desenho). */
.statusbar .sb-coords { min-width: 15ch; font-variant-numeric: tabular-nums; }
.statusbar .sb-snap { min-width: 14ch; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; color: var(--accent); }
/* Tela estreita: some o que é secundário; ficam dica, captura, Snap e avisos. */
@media (max-width: 760px) {
  .statusbar .sb-coords, .statusbar .sb-filter, .statusbar .sb-engine { display: none; }
}

/* ---- diálogos ---- */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 20, 0.5); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dialog { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 3px; box-shadow: var(--shadow); width: min(860px, 100%); max-height: min(660px, 100%); display: flex; flex-direction: column; min-height: 0; }
.dialog.narrow { width: min(520px, 100%); }
.dialog.mid { width: min(700px, 100%); }
.dhead { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--chrome); border-radius: 0; }
.dhead h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
.dhead .sub { color: var(--fg-soft); font-size: 11.5px; }
.dbody { padding: 12px 14px; overflow: auto; min-height: 0; flex: 1; }
.dfoot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); background: var(--chrome); border-radius: 0; }
.dtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.dtab { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 5px 12px; color: var(--fg-soft); margin-bottom: -1px; }
.dtab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(220px, 1fr); gap: 14px; }
/* "Propriedades do tipo" (Editar tipo): barra Família/Tipo no topo e, no diálogo do vão, prévia ao lado dos parâmetros. */
.tdlg-bar { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; margin: -12px -14px 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.tdlg-bar > label { color: var(--fg-soft); }
.tdlg-bar .in { min-width: 0; border: 1px solid var(--line-strong); background: var(--ro); border-radius: var(--r); padding: 3px 6px; height: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tdlg-bar .in.pick { padding: 0 4px; }
.tdlg-bar .btns { display: flex; gap: 6px; }
.tdlg-mid { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 0; margin: -12px -14px; min-height: 0; }
.tdlg-params { min-width: 0; padding: 12px 14px; }
.tdlg-pv { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--panel); border-left: 1px solid var(--line-strong); }
.tdlg-pv .rv-preview { margin: 0; height: 160px; }
.tdlg-caption { margin: 0; color: var(--fg-faint); font-size: 11px; line-height: 1.4; }
@media (max-width: 700px) {
  .tdlg-mid { grid-template-columns: minmax(0, 1fr); }
  .tdlg-pv { border-left: 0; border-top: 1px solid var(--line-strong); }
}
.layers { width: 100%; border-collapse: collapse; }
.layers th { text-align: left; font-weight: 500; font-size: 11px; color: var(--fg-faint); padding: 3px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.layers td { padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.layers tr.core td { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.layers .swatch { width: 14px; height: 14px; border-radius: 2px; border: 1px solid var(--line-strong); display: inline-block; vertical-align: middle; }
.layers .select { width: 100%; }
.layers .input.num { width: 58px; }
.iconrow { display: inline-flex; gap: 1px; }
.total { display: flex; justify-content: space-between; padding: 7px 4px; font-family: var(--font-mono); }
.matlist { border: 1px solid var(--line); border-radius: var(--r); background: var(--sheet); overflow: auto; max-height: 360px; }
.matitem { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; padding: 5px 8px; }
.matitem:hover { background: var(--chrome); }
.matitem.on { background: var(--accent-soft); }
.field-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; align-items: center; margin-bottom: 8px; }
.field-row > label { color: var(--fg-soft); }
.section-svg { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); width: 100%; }
.tplgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(226px, 1fr)); gap: 12px; }
.tpl { text-align: left; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--sheet); padding: 0; display: flex; flex-direction: column; overflow: hidden; cursor: default; transition: border-color .12s, box-shadow .12s; }
.tpl:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(0, 0, 0, .1); }
.tpl:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tpl-thumb { display: block; background: var(--chrome); border-bottom: 1px solid var(--line); aspect-ratio: 4 / 3; padding: 8px; }
.tpl-body { display: grid; gap: 3px; padding: 10px 12px 12px; }
.tpl-name { font-weight: 600; font-size: 12.5px; line-height: 1.3; }
.tpl-desc { color: var(--fg-soft); font-size: 11.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tpl-meta { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-faint); }
.tpl .area { font-family: var(--font-mono); color: var(--accent); font-size: 11px; margin-left: auto; }
.tpl svg { width: 100%; height: 100%; display: block; }
.kbtable { width: 100%; border-collapse: collapse; }
.kbtable td { padding: 3px 6px; border-bottom: 1px solid var(--line); }
.kbtable kbd { font-family: var(--font-mono); background: var(--chrome); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 5px; }
.error { color: var(--danger); }

/* ---- tutorial: faixa fina no topo da folha, para não cobrir o desenho ---- */
.tutorial { flex: none; margin: 6px 10px 0; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; box-shadow: var(--shadow); padding: 5px 8px 5px 10px; }
.tutorial .step-count { font-family: var(--font-mono); font-size: 11px; color: var(--accent); white-space: nowrap; }
.tutorial .step-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tutorial .dots { display: inline-flex; gap: 4px; }
.tutorial .pip { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
.tutorial .pip.done { background: var(--ok); border-color: var(--ok); }
.tutorial .pip.now { border-color: var(--accent); background: var(--accent-soft); }

/* ---- telas estreitas: painéis viram gavetas ---- */
@media (max-width: 700px) {
  .lbl-text { display: none; }
}
@media (max-width: 900px) {
  .workspace { grid-template-columns: minmax(0, 1fr) !important; position: relative; }
  .dock { position: absolute; z-index: 20; top: 0; bottom: 0; max-width: 92vw; box-shadow: var(--shadow); }
  .dock.left { left: 0; }
  .dock.right { right: 0; }
  .split { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- tabela de paredes (quantitativos) ---- */
.wsched-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
.wsched-bar label { color: var(--fg-soft); }
.wsched-scroll { overflow: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--r); background: var(--sheet); }
.wsched { min-width: 880px; }
.wsched th.num, .wsched td.num { text-align: right; }
.wsched td.num { font-family: var(--font-mono); white-space: nowrap; }
.wsched td.layers-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-soft); }
.wsched .sortbtn { display: inline-flex; align-items: center; gap: 3px; border: 0; background: transparent; padding: 0; font-size: 11px; font-weight: 500; color: var(--fg-faint); }
.wsched .sortbtn:hover { color: var(--fg); }
.wsched-h { margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--fg-soft); }
.wsched-msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-soft); font-size: 11.5px; }

/* ---- editor de camadas: "mais" por linha (prioridade de junção) ---- */
.fn-cell { display: flex; align-items: center; gap: 4px; min-width: 0; }
.fn-cell .select { flex: 1; min-width: 0; width: auto; }
.pbadge { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; white-space: nowrap; }
.ibtn.more { position: relative; }
.ibtn.more svg { transition: transform 0.12s; }
.ibtn.more.open svg { transform: rotate(90deg); }
.ibtn.more.changed::after { content: ''; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.layers tr.adv td { background: var(--chrome); padding: 6px 8px 8px; }
.adv-panel { display: grid; gap: 6px; }
.adv-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px; align-items: center; }
.adv-row > label { color: var(--fg-soft); }
.adv-ctl { display: inline-flex; align-items: center; gap: 6px; }
.adv-panel .input::placeholder { color: var(--fg-faint); }
.adv-help { margin: 0; color: var(--fg-soft); font-size: 11px; }
@media (max-width: 700px) {
  .adv-row { grid-template-columns: minmax(0, 1fr); }
}

/* ---- ações por tipo no navegador de projeto (TypeRow) ---- */
.type-replace { display: grid; gap: 6px; margin: 2px 10px 6px 28px; padding: 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--sheet); }
.type-replace label { display: grid; gap: 3px; color: var(--fg-soft); font-size: 11.5px; }
.type-replace .select { width: 100%; }
.type-replace-btns { display: flex; gap: 6px; justify-content: flex-end; }

/* ---- aba "Faixas" do tipo de parede (rodapé, barra de azulejo, friso) ---- */
.strips-help { padding: 0 0 8px; }
.strips-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.strips-scroll { overflow-x: auto; max-width: 100%; }
.strips-table { min-width: 640px; }
.strips-table td .input.wide { min-width: 120px; }
.strips-empty { color: var(--fg-faint); }
.strip-mat { width: 100%; display: flex; align-items: center; gap: 6px; text-align: left; }
.strip-mat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip-err td { padding: 0 4px 4px; color: var(--danger); font-size: 11.5px; border-bottom: 1px solid var(--line); }
.strips-foot { margin-top: 8px; }

/* ---- avisos de validação na barra de status (IssuesButton) ---- */
.issues-anchor { position: relative; margin-left: auto; display: inline-flex; flex-shrink: 0; }
.issues-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid currentColor; background: var(--panel); border-radius: var(--r); padding: 2px 8px; font-family: var(--font-mono); font-size: 11px; line-height: 1.5; white-space: nowrap; color: var(--warn); }
.issues-btn.err { color: var(--danger); }
.issues-btn:hover { background: var(--sheet); }
.issues-btn[aria-expanded='true'] { box-shadow: 0 0 0 2px var(--accent-soft); }
.issues-ok { margin-left: auto; font-size: 11px; color: var(--ok); white-space: nowrap; }
.issues-pop { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 30; width: min(380px, calc(100vw - 32px)); max-height: 50vh; overflow: auto; background: var(--sheet); color: var(--fg); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px 0; font-size: 12px; text-align: left; }
.issues-pop:focus { outline: none; }
.issues-group + .issues-group { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
.issues-group h3 { margin: 4px 12px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-soft); }
.issues-group.error h3 { color: var(--danger); }
.issues-group.warning h3 { color: var(--warn); }
.issues-group ul { list-style: none; margin: 0; padding: 0; }
.issues-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 6px 12px; }
.issues-item + .issues-item { border-top: 1px solid var(--line); }
.issues-msg { flex: 1; min-width: 0; line-height: 1.4; overflow-wrap: anywhere; }
.issues-item .chiplink { flex-shrink: 0; font-size: 12px; }
@media (max-width: 700px) {
  .issues-pop { position: fixed; left: 16px; right: 16px; bottom: 34px; width: auto; }
}

/* ---- vista de corte e elevação ---- */
.section-badge { position: absolute; left: 10px; top: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; max-width: calc(100% - 20px); background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; box-shadow: var(--shadow); padding: 3px 4px 3px 9px; color: var(--accent); font-family: var(--font-ui); font-size: 12px; }
.section-badge .section-name { min-width: 0; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.section-badge .section-kind { color: var(--fg-soft); font-size: 11px; white-space: nowrap; }
.section-badge .ibtn { background: var(--sheet); }
.view-rename { margin: 2px 10px 4px 28px; width: calc(100% - 38px); font-size: 12px; }

/* ---- perfil superior da parede (diálogo e linha de propriedades) ---- */
.profile-cell { display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0; }
.profile-cell .val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profile-note { padding: 0 10px 4px; color: var(--fg-soft); font-size: 11.5px; line-height: 1.4; }
.profile-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.profile-table { table-layout: auto; }
.profile-table .input.num { width: 72px; }
.profile-actions { margin-top: 6px; }
.profile-error { margin: 8px 0 0; font-size: 12px; }
.profile-hint { padding: 6px 0 0; font-size: 11.5px; }
.profile-svg { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); width: 100%; height: auto; display: block; }
.profile-svg .profile-straight { fill: none; stroke: var(--fg-faint); stroke-dasharray: 4 3; stroke-width: 1; }
.profile-svg .profile-fill { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; }
.profile-svg .profile-dot { fill: var(--accent); }
.profile-svg .profile-ground { stroke: var(--fg-soft); stroke-width: 1; }
.profile-svg .profile-tick { fill: var(--fg-faint); font-size: 10px; font-family: var(--font-mono); }
.profile-stats { margin: 10px 0 0; display: grid; gap: 4px; }
.profile-stats > div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 3px 4px; }
.profile-stats dt { color: var(--fg-soft); }
.profile-stats dd { margin: 0; font-family: var(--font-mono); }

/* ---- Capturas (botão Snap da barra de status e seu popover) ---- */
.snap-anchor { position: relative; display: inline-flex; flex-shrink: 0; margin-left: auto; }
.snap-anchor + .issues-anchor { margin-left: 0; }
.snap-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--r); padding: 2px 8px; font-family: var(--font-mono); font-size: 11px; line-height: 1.5; white-space: nowrap; color: var(--fg); cursor: default; }
.snap-btn:hover { background: var(--sheet); }
.snap-btn[aria-expanded='true'] { box-shadow: 0 0 0 2px var(--accent-soft); }
.snap-btn--disabled { opacity: 0.65; border-color: var(--line); color: var(--fg-soft); }
.snap-status-tag { font-family: var(--font-mono); font-size: 10px; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
.snap-status-tag.off { background: rgba(220, 53, 69, 0.15); color: #dc3545; }
.snap-count { color: var(--fg-soft); }
.snap-pop { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 30; width: min(320px, calc(100vw - 32px)); max-height: 65vh; overflow: auto; background: var(--sheet); color: var(--fg); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 12px; font-size: 12px; text-align: left; }
.snap-master-row { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--line-strong); }
.snap-master-info { display: flex; flex-direction: column; gap: 2px; }
.snap-master-hint { font-size: 10.5px; color: var(--fg-soft); }
.snap-master-hint code { background: var(--chrome); padding: 1px 4px; border-radius: 3px; border: 1px solid var(--line); font-family: var(--font-mono); }
.snap-row { display: flex; flex-direction: column; gap: 1px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.snap-row:last-child { border-bottom: 0; }
.snap-item-label { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.snap-sym { font-family: var(--font-mono); font-size: 13px; color: var(--accent); width: 14px; text-align: center; }
.snap-shortcut { font-size: 10px; color: var(--fg-soft); font-family: var(--font-mono); background: var(--chrome); padding: 1px 4px; border-radius: 3px; border: 1px solid var(--line); margin-left: 4px; }
.snap-desc { color: var(--fg-soft); font-size: 11px; line-height: 1.35; padding-left: 22px; }
.snap-actions { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
@media (max-width: 600px) {
  .snap-count { display: none; }
  .snap-pop { position: fixed; left: 16px; right: 16px; bottom: 36px; width: auto; }
}


/* ---- Ícones de ferramenta no estilo Revit (geometria em Icon.tsx; degradês em IconDefs) ----
   Traço de espessura fixa em pixels de tela, para ficar nítido de 14 a 28 px. */
.ic path, .ic circle { vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.ic .ic-s1, .ic .ic-s2, .ic .ic-s3, .ic .ic-bl, .ic .ic-gl { stroke: #5b6369; stroke-width: 1px; }
.ic .ic-s1 { fill: url(#ic-g1); }
.ic .ic-s2 { fill: url(#ic-g2); }
.ic .ic-s3 { fill: url(#ic-g3); }
.ic .ic-bl { fill: url(#ic-gb); }
.ic .ic-gl { fill: url(#ic-gg); }
.ic .ic-ln { fill: none; stroke: var(--ic-ink); stroke-width: 1.1px; }
.ic .ic-ln2 { fill: none; stroke: var(--ic-ink); stroke-width: 1.8px; }
.ic .ic-ac { fill: none; stroke: #e8892b; stroke-width: 1.6px; }
.ic .ic-fa { fill: #e8892b; stroke: none; }
.ic .ic-ds { stroke-dasharray: 3 2; }
.ic .ic-tx { fill: var(--ic-ink); stroke: none; font: 700 8px var(--font-ui); }

/* ===== apps/web/src/ribbon.css (cópia fiel) ===== */
/*
 * Faixa de ferramentas no padrão Revit (decisão 0032): linha de abas de 28 px, corpo de 96 px (painel 78 px + título 18 px),
 * botão grande com ícone de 32 px e rótulo de até 2 linhas, botão pequeno com ícone de 16 px e rótulo à direita, pilha de
 * até 3 pequenos na altura de um grande, botão dividido com ▾, título do painel em caixa normal.
 */
.ribbon-tabs { display: flex; align-items: flex-end; padding: 0 4px; height: 28px; background: var(--chrome); border-bottom: 1px solid var(--line-strong); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.ribbon-tabs::-webkit-scrollbar { display: none; }
.rtab { flex: none; height: 24px; padding: 0 11px; font-size: 12px; color: var(--fg); background: transparent; border: 1px solid transparent; border-bottom: 0; border-radius: 3px 3px 0 0; white-space: nowrap; }
.rtab:hover { background: var(--accent-soft); }
.rtab.on { height: 28px; margin-bottom: -1px; padding-bottom: 1px; background: var(--ribbon); border-color: var(--line-strong); font-weight: 600; position: relative; }
.rtab.file { margin-right: 3px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.rtab.file:hover { filter: brightness(1.12); }
.rtab.contextual { color: var(--revit-green); font-weight: 600; }
.rtab.contextual.on { background: var(--revit-green-soft); border-top: 2px solid var(--revit-green-border); }

.ribbon { display: flex; height: 96px; background: var(--ribbon); border-bottom: 1px solid var(--line-strong); overflow-x: auto; overflow-y: hidden; }
.ribbon.ctx { background: var(--revit-green-soft); }
.rb-panel { display: flex; flex-direction: column; flex: none; border-right: 1px solid var(--line); }
.rb-cols { display: flex; flex: 1; min-height: 0; align-items: stretch; gap: 1px; padding: 3px 3px 0; }
.rb-title { height: 18px; padding: 0 10px; font-size: 11px; line-height: 18px; text-align: center; white-space: nowrap; color: var(--fg-soft); }

.rb-btn { font: inherit; font-size: 11.5px; color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 2px; }
.rb-btn:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--line-strong); }
.rb-btn.on { background: var(--accent-soft); border-color: var(--accent); }
.rb-btn:disabled { cursor: default; opacity: 0.45; }
.rb-btn.soon { opacity: 0.5; }
.rb-btn:disabled svg, .rb-btn.soon svg, .rb-menuitem.soon svg { filter: grayscale(1); }
.rb-large { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 46px; max-width: 80px; padding: 3px 4px 1px; line-height: 1.12; text-align: center; white-space: normal; }
.rb-large .rb-lbl { display: block; min-height: 26px; }
.rb-small { display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 6px 0 4px; text-align: left; white-space: nowrap; }
.rb-stack { display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 0 2px; }

/* Botão dividido: o ícone roda a variante padrão, o rótulo com ▾ abre o menu. */
.rb-split { position: relative; }
.rb-split.large { display: flex; flex-direction: column; align-items: stretch; min-width: 46px; max-width: 80px; border: 1px solid transparent; border-radius: 2px; }
.rb-split.large:hover { border-color: var(--line-strong); }
.rb-split.large.on { border-color: var(--accent); background: var(--accent-soft); }
.rb-split.large .rb-btn { border: 0; background: transparent; }
.rb-split.large .rb-top { align-items: center; padding: 3px 4px 0; }
.rb-split.large .rb-bottom { display: block; padding: 2px 4px 1px; text-align: center; line-height: 1.12; white-space: normal; }
.rb-split.large .rb-bottom .rb-lbl { display: block; min-height: 26px; }
.rb-split.large .rb-btn:hover:not(:disabled) { background: var(--accent-soft); }
.rb-split.small { display: flex; align-items: stretch; }
.rb-split.small .rb-arrow { width: 14px; padding: 0; font-size: 9px; }

.rb-menu { position: fixed; z-index: 200; min-width: 220px; padding: 2px 0; font-size: 12px; background: var(--sheet); border: 1px solid var(--line-strong); box-shadow: var(--shadow); }
.rb-menuitem { display: flex; align-items: center; gap: 8px; width: 100%; padding: 3px 12px 3px 8px; font: inherit; text-align: left; color: var(--fg); background: none; border: 0; }
.rb-menuitem:hover:not(:disabled) { background: var(--accent-soft); }
.rb-menuitem.on { font-weight: 600; }
.rb-menuitem.soon { opacity: 0.5; cursor: default; }
.rb-menuitem em { margin-left: auto; padding-left: 18px; font-size: 10px; font-style: normal; color: var(--fg-faint); }

/* ---- barra de título: botão R (Arquivo), acesso rápido e centro de informações ---- */
.titlebar { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px; background: var(--chrome); border-bottom: 1px solid var(--line); }
.app-r { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border: 0; border-radius: 4px; background: var(--accent); color: var(--accent-fg); font: 600 12px var(--font-mono); }
.app-r:hover { filter: brightness(1.12); }
.qat { display: flex; align-items: center; gap: 1px; }
.qbtn { width: 26px; height: 26px; flex: none; display: grid; place-items: center; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 2px; color: var(--fg); }
.qbtn:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--line-strong); }
.qbtn.on { background: var(--accent-soft); border-color: var(--accent); }
.qbtn:disabled { opacity: 0.4; cursor: default; }
.vsep { width: 1px; height: 18px; margin: 0 4px; background: var(--line-strong); }
.tb-title { flex: 1; min-width: 0; padding: 0 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
.infocenter { position: relative; display: flex; align-items: center; gap: 4px; flex: none; }
.ic-search { position: relative; display: flex; align-items: center; height: 22px; width: 190px; padding: 0 6px 0 0; background: var(--sheet); border: 1px solid var(--line-strong); }
.ic-search:focus-within { border-color: var(--accent); }
.ic-input { flex: 1; min-width: 0; height: 100%; padding: 0 8px; font-size: 11.5px; background: transparent; border: 0; outline: none; }
.ic-results, .ic-help { position: absolute; z-index: 150; top: calc(100% + 2px); right: 0; min-width: 280px; background: var(--sheet); border: 1px solid var(--line-strong); box-shadow: var(--shadow); font-size: 12px; }
.ic-help { min-width: 190px; padding: 2px 0; }
.ic-search .ic-results { left: 0; right: auto; }
.ic-hit { display: flex; justify-content: space-between; gap: 14px; width: 100%; padding: 4px 10px; font: inherit; text-align: left; color: var(--fg); background: none; border: 0; }
.ic-hit:hover, .ic-hit[aria-selected='true'] { background: var(--accent-soft); }
.ic-hit em { font-style: normal; font-size: 10.5px; color: var(--fg-faint); white-space: nowrap; }
.ic-none { padding: 8px 10px; color: var(--fg-faint); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; }
.seg button { padding: 3px 12px; background: var(--panel); border: 0; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-fg); }

/* ---- menu Arquivo ---- */
.fm-back { position: absolute; z-index: 60; inset: 32px 0 0 0; background: rgba(10, 16, 20, 0.35); }
.fm { display: grid; grid-template-columns: 210px minmax(0, 1fr); width: min(720px, 100%); height: 100%; background: var(--panel); border-right: 1px solid var(--line-strong); box-shadow: var(--shadow); }
.fm-list { display: flex; flex-direction: column; padding: 8px 0; background: var(--chrome); border-right: 1px solid var(--line); }
.fm-list hr { margin: 6px 10px; border: 0; border-top: 1px solid var(--line-strong); }
.fm-item { display: flex; justify-content: space-between; padding: 7px 16px; font-size: 13px; text-align: left; color: var(--fg); background: none; border: 0; }
.fm-item:hover { background: var(--accent-soft); }
.fm-item.on { background: var(--sheet); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.fm-pane { padding: 14px 22px; overflow: auto; }
.fm-pane h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
.fm-cards { display: grid; gap: 8px; }
.fm-card { display: grid; gap: 2px; padding: 10px 14px; text-align: left; color: var(--fg); background: var(--sheet); border: 1px solid var(--line-strong); border-radius: var(--r); }
.fm-card:hover { border-color: var(--accent); }
.fm-card span { color: var(--fg-soft); font-size: 12px; }
.fm-field { display: grid; gap: 4px; max-width: 360px; }
.fm-row { display: flex; align-items: center; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.fm-row > span:first-child { width: 130px; color: var(--fg-soft); }
.fm-hint { color: var(--fg-soft); }

/* ---- navegador de projeto: árvore no padrão Revit (caixas ⊞/⊟, negrito = ativo) ---- */
.btree { padding: 4px 0; font-size: 12px; color: var(--fg); }
.bnode { display: flex; align-items: center; gap: 4px; padding: 1px 6px 1px 0; white-space: nowrap; cursor: default; outline: none; user-select: none; }
.bnode:hover { background: var(--accent-soft); }
.bnode.sel { background: var(--accent-soft); outline: 1px dotted var(--accent); outline-offset: -1px; }
.bnode:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
.bnode.bold .blabel { font-weight: 700; }
.bnode svg { flex: none; }
.blabel { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.bbox { flex: none; width: 11px; height: 11px; margin-left: 4px; display: inline-grid; place-items: center; font: 9px/9px var(--font-mono); color: var(--fg-soft); background: var(--sheet); border: 1px solid var(--line-strong); }
.bbox.none { visibility: hidden; }
.bkids { padding-left: 15px; }
.btree-empty { margin: 2px 8px 4px 22px; font-size: 11px; line-height: 1.4; color: var(--fg-faint); }
.btree .view-rename { height: 18px; padding: 0 4px; font-size: 12px; }
.ph-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph-x { flex: none; margin-left: 8px; padding: 0 3px; font-size: 11px; color: var(--fg-faint); background: none; border: 0; }
.ph-x:hover { color: var(--fg); }
.rb-sep { margin: 2px 6px; border: 0; border-top: 1px solid var(--line); }
.rb-menuitem.danger:not(:disabled) { color: var(--danger); }
.rb-menuitem:disabled { opacity: 0.45; cursor: default; }
.tree-empty { margin: 2px 10px 6px; color: var(--fg-faint); font-size: 11.5px; line-height: 1.4; }

.ph-right { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }

/* ---- barra de controle da vista (faixa fixa na base) e barra de navegação (lateral da vista) ---- */
.vcb { display: flex; align-items: center; gap: 2px; height: 26px; padding: 0 8px; background: var(--ribbon); border-top: 1px solid var(--line-strong); font-size: 11px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.vcb-field { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 2px 0 5px; border: 1px solid transparent; border-radius: 2px; }
.vcb-field:hover { background: var(--accent-soft); border-color: var(--line-strong); }
.vcb-select { height: 18px; padding: 0 2px; font-size: 11px; color: var(--fg); background: transparent; border: 0; outline: none; cursor: pointer; }
.vcb-select option { color: #1a202c; background: #fff; }
.vcb-btn { display: inline-flex; align-items: center; gap: 4px; flex: none; height: 20px; min-width: 22px; padding: 0 5px; justify-content: center; font-size: 11px; color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 2px; }
.vcb-btn:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--line-strong); }
.vcb-btn.on { background: var(--accent-soft); border-color: var(--accent); }
.vcb-btn:disabled { opacity: 0.4; cursor: default; }
.vcb-btn:disabled svg { filter: grayscale(1); }
.vcb-sep { flex: none; width: 1px; height: 14px; margin: 0 4px; background: var(--line-strong); }
.navbar { position: absolute; z-index: 2; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 1px; padding: 2px; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line-strong); }
.navbar.below-cube { top: 160px; }
.navbar button { width: 26px; height: 24px; display: grid; place-items: center; padding: 0; color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 2px; }
.navbar button:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--line-strong); }
.navbar button:disabled { opacity: 0.4; cursor: default; }
.navbar .navminus { font-size: 18px; line-height: 1; }

/* ---- barra de status: filtro de seleção ---- */
.sb-filter { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 7px; background: var(--sheet); border: 1px solid var(--line-strong); }

/* ---- paleta de propriedades: divisória rótulo|valor arrastável ---- */
.lbl-split-wrap { position: sticky; top: 0; z-index: 5; height: 0; }
.lbl-split { position: absolute; top: 0; left: calc(var(--lbl, 46%) - 3px); width: 6px; cursor: col-resize; touch-action: none; }
.lbl-split:hover { background: color-mix(in srgb, var(--accent) 40%, transparent); }

/* ===== apps/web/src/dock.css (cópia fiel) ===== */
/* ---- docks: Propriedades e Navegador acoplados aos lados (padrão Revit), redimensionáveis e movíveis ---- */
.dock { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
.dock.left { border-right: 1px solid var(--line-strong); }
.dock.right { border-left: 1px solid var(--line-strong); }
.dock.empty { width: 0; border: 0; }
.dock-pane { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.dock-split.h { flex: none; height: 5px; background: var(--line-strong); cursor: row-resize; touch-action: none; }
.dock-split.h:hover, .dock-split.h:focus-visible { background: var(--accent); outline: none; }
.dock-split.v { position: absolute; top: 0; bottom: 0; z-index: 6; width: 6px; cursor: col-resize; touch-action: none; }
.dock-split.v.left { right: -3px; }
.dock-split.v.right { left: -3px; }
.dock-split.v:hover, .dock-split.v:focus-visible { background: color-mix(in srgb, var(--accent) 45%, transparent); outline: none; }

/* cabeçalho é a alça de arrasto: não seleciona texto ao arrastar; foco por teclado (Alt+Setas) mostra o contorno */
.panel-head { user-select: none; }
.panel-head:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
body.dock-dragging, body.dock-dragging * { cursor: grabbing !important; }

/* ---- arrasto de painel (ver ui/dockDragSession.ts): fantasma no cursor, prévia exata da área e guias nas bordas ---- */
.dd-root { position: fixed; inset: 0; z-index: 10000; pointer-events: none; }
.dd-edge { position: fixed; width: 3px; background: color-mix(in srgb, var(--accent) 55%, transparent); }
/* A prévia é o retângulo real onde o painel vai ficar. A troca entre zonas desliza em ~100 ms. */
.dd-preview { position: fixed; box-sizing: border-box; opacity: 0; background: color-mix(in srgb, var(--accent) 20%, transparent); border: 2px solid var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, #fff 35%, transparent); transition: left 0.1s ease-out, top 0.1s ease-out, width 0.1s ease-out, height 0.1s ease-out, opacity 0.08s linear; }
.dd-preview.on { opacity: 1; }
.dd-preview-label { position: absolute; left: 0; top: 0; right: 0; padding: 3px 8px; font-size: 11.5px; font-weight: 600; color: #fff; background: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Miniatura do painel que acompanha o cursor, com a pegada do clique preservada. */
.dd-ghost { position: fixed; left: 0; top: 0; display: flex; flex-direction: column; box-sizing: border-box; opacity: 0.88; will-change: transform; background: var(--panel); border: 1px solid var(--accent); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
.dd-ghost.no-drop { opacity: 0.55; border-color: var(--line-strong); }
.dd-ghost-title { flex: none; padding: 4px 8px; font-size: 11.5px; font-weight: 600; background: var(--chrome); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dd-ghost-body { flex: 1; background: repeating-linear-gradient(var(--sheet) 0 20px, var(--panel) 20px 21px); }
/* O painel de origem fica esmaecido enquanto é levado. */
.dock-pane.dd-source { opacity: 0.4; }

/* ===== Acréscimos do protótipo (o resto é o CSS real do app, copiado de apps/web/src) ===== */
html, body { height: 100%; }
.app { height: 100vh; }
.stage .canvas-wrap { cursor: crosshair; }
.stage .canvas-wrap.select-mode { cursor: default; }
#plan { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; }
#planOver { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#planOver > * { pointer-events: auto; }
.sk-ink { fill: none; stroke: var(--fg); stroke-linecap: butt; stroke-linejoin: miter; }
.sk-soft { fill: none; stroke: var(--fg-soft); }
.sk-ghost { fill: none; stroke: var(--accent); }
.sk-bad { fill: none; stroke: var(--danger); }
.wall-pass1 { fill: none; stroke: var(--fg); stroke-linejoin: miter; }
.gridline { stroke: color-mix(in srgb, var(--line) 70%, transparent); stroke-width: 1; }
.gridline.major { stroke: var(--line); }
.tmpdim-line { stroke: var(--accent); stroke-width: 1; fill: none; }
.tmpdim-ext { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; fill: none; opacity: 0.85; }
.tmpdim-txt { font: 11px var(--font-mono); fill: var(--accent); text-anchor: middle; paint-order: stroke; stroke: var(--sheet); stroke-width: 3px; }
.tagtxt { font: 600 10.5px var(--font-ui); fill: var(--fg); text-anchor: middle; paint-order: stroke; stroke: var(--sheet); stroke-width: 3px; }
.roomtxt { font: 11.5px var(--font-ui); fill: var(--fg-faint); text-anchor: middle; }
.snaplbl { font: 11px var(--font-ui); fill: #fff; }
@keyframes flash { 0% { stroke: var(--accent); stroke-width: 4; } 100% { } }
.flash .sk-ink { animation: flash .7s ease-out; }

/* dimensão temporária editável (campo HTML sobre a planta) */
.tdim-input { position: absolute; transform: translate(-50%, -50%); width: 64px; height: 20px; text-align: center; font: 11px var(--font-mono); color: var(--accent); background: var(--sheet); border: 1px solid var(--accent); border-radius: 2px; padding: 0 2px; user-select: text; }
.tdim-input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
/* alças de inverter (como as setas de inversão do Revit) */
.flipgrip { position: absolute; width: 24px; height: 24px; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid var(--accent); background: var(--sheet); color: var(--accent); display: grid; place-items: center; font: 14px/1 var(--font-ui); padding: 0; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.flipgrip:hover { background: var(--accent); color: var(--accent-fg); }
.chip-float { position: absolute; transform: translate(12px, 14px); background: rgba(26,32,44,.92); color: #fff; border-radius: 3px; padding: 3px 7px; font-size: 11px; white-space: nowrap; pointer-events: none !important; }
.chip-float b { font-weight: 600; color: #9fd1ff; }
.chip-float.bad { background: rgba(160,32,36,.94); }
.typebox { z-index: 12; }
.guide { position: absolute; right: 56px; top: 10px; width: 262px; z-index: 5; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; box-shadow: var(--shadow); font-size: 11.5px; }
.guide > header { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: var(--chrome); border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; font-weight: 600; }
.guide > header button { margin-left: auto; border: 0; background: none; color: var(--fg-faint); padding: 0 3px; }
.guide ul { margin: 0; padding: 6px 8px 8px 8px; list-style: none; display: grid; gap: 5px; }
.guide li { display: grid; grid-template-columns: 74px 1fr; gap: 6px; align-items: baseline; color: var(--fg-soft); }
.guide kbd, .kb { font: 10.5px var(--font-mono); background: var(--chrome); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; color: var(--fg); white-space: nowrap; }
.guide.min ul { display: none; }

/* marca "novo" (o que este protótipo propõe e o app ainda não tem) */
.nb { display: none; margin-left: 5px; font: 600 9px/12px var(--font-ui); text-transform: uppercase; letter-spacing: .04em; color: #fff; background: #1f9d55; border-radius: 8px; padding: 0 5px; vertical-align: middle; }

/* ---- p1-data.js ---- */
'use strict';

const $ = (s, r = document) => r.querySelector(s);

/* ---------- famílias (o que o tipo ESCOLHE). `have`: já existe no Hestia (decisão 0017); o resto é proposta ---------- */
const FAM = {

/* ---------- construção de tipos ---------- */
function mkType(id, fam, name, code, w, h, sill, extra = {}) {
  const F = FAM[fam];
  return Object.assign({
    id, fam, kind: F.kind, name, code, desc: '', w, h, sill,

const TYPES = {};
const addT = (t) => { TYPES[t.id] = t; return t; };

/* ---------- seletor de tipo (menu) ---------- */
function typeMenuHTML(kind) {
  const q = (ST.menuQ || '').toLowerCase();
  const all = Object.values(TYPES).filter((t) => t.kind === kind && (!q || (t.name + ' ' + t.code + ' ' + FAM[t.fam].name).toLowerCase().includes(q)));
  const favs = all.filter((t) => t.fav);
  const row = (t) => `<button class="opt ${t.id === (ST.sel ? OPS.find((o) => o.id === ST.sel).typeId : curTypeId()) ? 'on' : ''}" data-pick="${t.id}"><span class="thumb">${typeThumb(t)}</span><span class="n">${esc(t.name)}</span><span class="c">${esc(t.code)}</span></button>`;
  let h = `<div class="search-wrap"><input class="search" id="menuQ" placeholder="Buscar tipo, código ou família" value="${esc(ST.menuQ || '')}"></div><div class="list">`;
  if (favs.length) h += `<div class="fam">★ Favoritos ${NEW}</div>` + favs.map(row).join('');
  FAM_ORDER[kind].forEach((fid) => { const ts = all.filter((t) => t.fam === fid); if (ts.length) h += `<div class="fam">${FAM[fid].name}</div>` + ts.map(row).join(''); });
  h += `<div class="fam" style="font-weight:400;color:var(--accent)"><span data-act="openLib" style="cursor:default">+ Carregar família da biblioteca…</span></div></div>`;
  return h;
}

function checksFor(d) {
  const door = d.kind === 'door', out = [];
  const fw = d.frameStyle === 'block' ? 0 : d.frameW;
  const clear = d.w - 2 * fw, hClear = d.h - (door ? fw : 2 * fw);
  if (d.leaves === 0) out.push(['ok', `Vão livre: sem folha — recorte ${cmv(d.w)} × ${cmv(d.h)} cm.`]);
  else if (door) {
    out.push([clear >= .8 - 1e-6 ? 'ok' : 'warn', `Largura livre ${cmv(clear)} cm <em>· NBR 9050: ≥ 80 cm em rota acessível</em>`]);
    out.push([hClear >= 2.1 - 1e-6 ? 'ok' : 'warn', `Altura livre ${cmv(hClear)} cm <em>· mínimo usual 210 cm</em>`]);
  } else {
    const fr_ = VENT[d.fam] ?? 0, area = d.w * d.h * fr_;
    out.push([area > 0 ? 'ok' : 'warn', area > 0 ? `Área útil de ventilação ${fm(area)} m² <em>· ${Math.round(fr_ * 100)}% do vão (${FAM[d.fam].name.toLowerCase()})</em>` : 'Janela fixa: não conta como ventilação.']);
    if (d.sill < .9 && d.sill > 0) out.push(['warn', `Peitoril de ${cmv(d.sill)} cm: acima do térreo exige guarda-corpo ≥ 110 cm (NBR 14718).`]);
  }
  if (d.frameStyle !== 'block' && d.frameD > .14) out.push(['warn', `Profundidade do batente ${fm(d.frameD * 100, 0)} cm > núcleo da parede (14 cm): será limitada.`]);
  out.push([d.lintel ? 'ok' : 'warn', d.lintel ? `Verga ${cmv(d.lintel.h)} cm, transpasse ${cmv(d.lintel.over)} cm <em>· valor do projeto estrutural</em>` : 'Sem verga: confira o projeto estrutural.']);
  if (door && d.fire) out.push(['ok', `Porta corta-fogo ${d.fire}: exige batente e ferragens certificados.`]);
  return out;
}

  $('#dApply').addEventListener('click', commitDraft);
  $('#dNew').addEventListener('click', () => {
    const F = FAM[DLG.draft.fam], n = Object.keys(TYPES).length + 1, code = (DLG.draft.kind === 'door' ? 'P-' : 'J-') + String(Object.values(TYPES).filter((t) => t.kind === DLG.draft.kind).length + 1).padStart(2, '0');
    const t = mkType('t_n' + n, DLG.draft.fam, F.name + ' novo', code, F.def.w, F.def.h, DLG.draft.kind === 'window' ? 1.0 : 0, { leaves: F.leaves[0] });
    TYPES[t.id] = t; DLG.id = t.id; DLG.draft = JSON.parse(JSON.stringify(t)); renderCtr(); renderPv(); refreshBrowserCounts(); toast('Tipo novo criado na família ' + F.name + '.');
  });
  ov.addEventListener('click', (e) => {
    const lf = e.target.closest('[data-libfam]'); if (lf) { DLG.libFam = lf.dataset.libfam; applyFamily(DLG.draft, DLG.libFam); renderLib(); renderCtr(); renderPv(); return; }
    const lv = e.target.closest('[data-libvar]'); if (lv) { const v = variantsOf(DLG.libFam || DLG.draft.fam)[+lv.dataset.libvar]; applyFamily(DLG.draft, DLG.libFam || DLG.draft.fam); Object.assign(DLG.draft, JSON.parse(JSON.stringify(v.s))); renderCtr(); renderPv(); return; }
    const ch = e.target.closest('[data-choice]'); if (ch) { setP(DLG.draft, ch.dataset.choice, ch.dataset.v); renderCtr(); renderPv(); return; }
    const vw = e.target.closest('[data-view]'); if (vw) { DLG.view = vw.dataset.view; renderPv(); return; }
    const pb = e.target.closest('[data-pv]'); if (pb) { if (pb.dataset.pv === 'hand') DLG.pop.flipHand = !DLG.pop.flipHand; else DLG.pop.flipFacing = !DLG.pop.flipFacing; renderPv(); return; }
    if (e.target.id === 'dFav') { DLG.draft.fav = !DLG.draft.fav; renderCtr(); return; }
    if (e.target.id === 'dDup') { const n = Object.keys(TYPES).length + 1, t = JSON.parse(JSON.stringify(DLG.draft)); t.id = 't_n' + n; t.name += ' (cópia)'; t.code = t.code + 'b'; TYPES[t.id] = t; DLG.id = t.id; DLG.draft = t; renderCtr(); renderPv(); refreshBrowserCounts(); toast('Tipo duplicado.'); return; }
    if (e.target.id === 'dRen') { const nn = prompt('Novo nome do tipo', DLG.draft.name); if (nn) { DLG.draft.name = nn; renderCtr(); } return; }
    const sm = e.target.closest('summary'); if (sm) { const det = sm.parentElement; setTimeout(() => { if (det.open) DLG.secs.add(det.dataset.sec); else DLG.secs.delete(det.dataset.sec); }, 0); }
  });
  ov.addEventListener('input', (e) => {
    if (e.target.id === 'libQ') { DLG.libQ = e.target.value; const pos = e.target.selectionStart; renderLib(); const q = $('#libQ'); q.focus(); q.setSelectionRange(pos, pos); return; }
    const a = e.target.dataset.pvang; if (a) { DLG.draft[a] = +e.target.value; e.target.nextElementSibling.textContent = e.target.value + '°'; renderPvStageOnly(); }
  });
  ov.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'dFam') { applyFamily(DLG.draft, t.value); DLG.libFam = t.value; renderLib(); renderCtr(); renderPv(); return; }
    if (t.id === 'dType') { DLG.id = t.value; DLG.draft = JSON.parse(JSON.stringify(TYPES[t.value])); DLG.libFam = DLG.draft.fam; renderLib(); renderCtr(); renderPv(); return; }
    const p = t.dataset.b; if (!p) return;
    const k = t.dataset.k; let v;
    if (k === 'num') { const sc = +t.dataset.scale || 100; v = parseFloat(String(t.value).replace(',', '.')); if (isNaN(v)) { renderCtr(); return; } v = v / sc; if (t.dataset.min !== undefined) v = Math.max(v, +t.dataset.min / sc); if (t.dataset.max !== undefined) v = Math.min(v, +t.dataset.max / sc); }
    else if (k === 'chk') { v = t.checked; if (t.dataset.obj) v = v ? JSON.parse(JSON.stringify(DEFAULTS[t.dataset.obj])) : null; }
    else if (k === 'int') v = parseInt(t.value, 10);
    else if (k === 'detail') v = t.value === 'scale' || t.value === 'off' ? t.value : +t.value;
    else v = t.value;
    if (['penLeaf', 'penArc'].includes(p)) v = parseInt(t.value, 10);
    setP(DLG.draft, p, v);
    if (p === 'leaves' && DLG.draft.kind === 'window') DLG.draft.cols = Math.max(DLG.draft.cols, DLG.draft.leaves);
    if (t.dataset.r || p === 'w' || p === 'h' || p === 'sill') renderCtr();
    renderPv();
  });
  // girar o 3D arrastando
  pv.addEventListener('mousedown', (e) => {
    const st = e.target.closest('#pvStage'); if (!st || !DLG.view.startsWith('3d')) return; e.preventDefault();
    let lx = e.clientX, ly = e.clientY;
    const mv = (ev) => { DLG.yaw += (ev.clientX - lx) * .5; DLG.pitch = clamp(DLG.pitch + (ev.clientY - ly) * .4, 5, 80); lx = ev.clientX; ly = ev.clientY; renderPvStageOnly(); };
    const up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  });
}
function renderPvStageOnly() {
  const d = DLG.draft, op = { flipHand: DLG.pop.flipHand, flipFacing: DLG.pop.flipFacing }, st = $('#pvStage'); if (!st) return;
  const plD = { projected: 'high', projover: 'high' }[d.planDisp] || { scale: 'mid', 50: 'high', 100: 'mid', 200: 'low', off: 'low' }[d.detail2d] || 'mid';
  let svg = DLG.view === 'plan' ? planPreviewSVG(d, op, plD) : DLG.view === 'elev' ? elevSVG(d, op) : DLG.view === 'sec' ? sectionSVG(d) : view3D(d, op, d.ang3d, { mode: DLG.view === '3dl' ? 'lines' : 'shaded', yaw: DLG.yaw, pitch: DLG.pitch });
  const caps = st.querySelectorAll('.cap, .cap2'); st.innerHTML = svg; caps.forEach((c) => st.appendChild(c));
}
function escDlg(e) { if (e.key === 'Escape' && DLG.el) { e.stopPropagation(); closeTypeDialog(); window.removeEventListener('keydown', escDlg, true); } }

'use strict';
/* =====================================================================================================

function updateScaleLabel() {
  const raw = 3780 / V().s, std = [20, 25, 50, 75, 100, 125, 150, 200, 250, 500];
  const n = std.reduce((a, b) => (Math.abs(b - raw) < Math.abs(a - raw) ? b : a));
  const el = $('#vscale'); if (el) el.textContent = '1 : ' + n;
}
function doAct(a) {
  const cur = TYPES[curTypeId()];
  switch (a) {
    case 'tool-select': setTool('select'); break;
    case 'tool-door': setTool('door'); break;
    case 'tool-window': setTool('window'); break;
    case 'editType': openTypeDialog(ST.sel && ST.tool === 'select' ? OPS.find((o) => o.id === ST.sel).typeId : cur.id); break;
    case 'openLib': openTypeDialog(ST.sel && ST.tool === 'select' ? OPS.find((o) => o.id === ST.sel).typeId : cur.id, { lib: true }); break;
    case 'toggleTag': ST.tagOnPlace = !ST.tagOnPlace; refreshRibbon(); break;
    case 'flipHand': ST.flipHand = !ST.flipHand; if (ST.mouse) ST.ghost = ghostAt(...toWorld(...ST.mouse)); refreshRibbon(); refreshPalette(); renderOver(); break;
    case 'flipFacing': ST.tabFlip = !ST.tabFlip; if (ST.mouse) ST.ghost = ghostAt(...toWorld(...ST.mouse)); refreshRibbon(); renderOver(); break;
    case 'selFlipHand': flipSel('hand'); break;
    case 'selFlipFacing': flipSel('facing'); break;
    case 'del': deleteSel(); break;
    case 'similar': { const o = OPS.find((x) => x.id === ST.sel); if (o) { const t = typeOf(o); if (t.kind === 'door') ST.curDoor = t.id; else ST.curWin = t.id; setTool(t.kind); } break; }
    case 'schedule': showSchedule(); break;
    case 'openLibSimple': openTypeDialog(cur.id, { lib: true }); break;
    default: break;
  }
}
function bindShell() {
  $('#rtabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-rtab]'); if (!b) return; const k = b.dataset.rtab;
    if (k === 'file') { toast('Menu Arquivo — fora do protótipo.'); return; }
    ST.rtab = k; refreshRibbon();
  });
  $('#ribbon').addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b && b.dataset.act) doAct(b.dataset.act); });
  $('#optbar').addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b) doAct(b.dataset.act); });
  $('#ribbon').addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'rbFacing') ST.facingMode = t.value; else if (t.id === 'rbToward') ST.openToward = t.value; else if (t.id === 'rbAnchor') ST.anchor = t.value;
    else if (t.id === 'rbSnap') ST.snapOn = t.checked; else if (t.id === 'rbDim') ST.dimMode = t.value;
    else if (t.id === 'rbClear') { const v = parseFloat(String(t.value).replace(',', '.')); if (!isNaN(v)) ST.clear = clamp(v / 100, 0, .5); }
    if (ST.mouse && ST.tool !== 'select') ST.ghost = ghostAt(...toWorld(...ST.mouse));
    refreshRibbon(); renderOver();
  });
  $('#newsw').addEventListener('change', (e) => document.body.classList.toggle('show-new', e.target.checked));
  $('#vDetail').addEventListener('change', (e) => { ST.viewDetail = e.target.value; renderPlan(); });
  $('#vTags').addEventListener('change', (e) => { ST.tagVis = e.target.value === '1'; renderPlan(); });
  $('#zIn').addEventListener('click', () => zoomBy(1.2)); $('#zOut').addEventListener('click', () => zoomBy(1 / 1.2)); $('#zFit').addEventListener('click', fitView);
  $('#guideMin').addEventListener('click', () => $('#guide').classList.toggle('min'));
  document.addEventListener('mousedown', (e) => { if (ST.menuOpen && !e.target.closest('.rv-tsel-wrap')) { ST.menuOpen = false; refreshPalette(); } });
  window.addEventListener('resize', () => { renderPlan(); });
}
function zoomBy(k) { const r = cwEl().getBoundingClientRect(), cx = r.width / 2, cy = r.height / 2, wp = toWorld(cx, cy); V().s = clamp(V().s * k, 22, 190); V().x = cx - wp[0] * V().s; V().y = cy - wp[1] * V().s; renderPlan(); updateScaleLabel(); }

window.addEventListener('DOMContentLoaded', () => {
  ST.pg = {}; ST.bx = {}; ST.tagVis = true;
  document.body.classList.add('show-new');
  buildShell(); bindShell(); bindCanvas(); bindKeys(); bindPalette(); bindBrowser();
  $('#browser').innerHTML = browserHTML();
  fitView(); setTool('door');
  // ganchos para teste automatizado
  window.__proto = { ST, TYPES, OPS, WF, openTypeDialog, setTool, ghostAt, DLG, toWorld, SX, SY };
});
